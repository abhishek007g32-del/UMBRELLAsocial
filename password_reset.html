<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - UMBRELLAsocial</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyC4DGER69Xfc3P_xcQR5RtXH3oBuLP9rKY",authDomain:"umbrellasocial.firebaseapp.com",projectId:"umbrellasocial",storageBucket:"umbrellasocial.firebasestorage.app",messagingSenderId:"126237795119",appId:"1:126237795119:web:db54ac49f178e0136bf7da"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(); const auth=firebase.auth(); auth.signInAnonymously().catch(()=>{});
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
body{font-family:Inter,sans-serif;background:#000}
</style>
</head>
<body class="min-h-screen bg-black text-zinc-200 flex items-center justify-center p-6">
<div class="w-full max-w-[440px]">
  <div class="text-center">
    <div class="w-24 h-24 rounded-full bg-green-500 flex items-center justify-center mx-auto text-black text-[36px] shadow-[0_0_60px_rgba(34,197,94,0.5)]"><i class="fa-solid fa-key"></i></div>
    <h1 class="text-[34px] font-black mt-6 leading-[0.9]">Founder <span class="text-green-400">Approved!</span><br>Reset Password</h1>
    <p class="text-[13px] text-zinc-500 mt-4">Your application approved. This is separate secure page to unlock account.</p>
  </div>
  <div class="mt-8 p-5 rounded-[24px] bg-[#0e0e10] border border-[#1e1e1e] space-y-3">
    <p class="text-[11px] text-zinc-400 flex justify-between"><span>Email</span><span id="emailShow" class="text-white font-bold"></span></p>
    <p class="text-[11px] text-zinc-400 flex justify-between"><span>Status</span><span class="text-green-400 font-bold">APPROVED BY FOUNDER</span></p>
  </div>
  <div class="mt-6 p-5 rounded-[24px] bg-green-500/5 border border-green-500/20">
    <p class="text-[10px] font-black tracking-widest text-green-400"><i class="fa-solid fa-key mr-1"></i> SECRET KEY *</p>
    <div class="relative mt-3"><i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-zinc-600 text-[12px]"></i><input id="secretKeyInput" placeholder="UMBRELLA-XXXX-XXXX-XXXX" class="w-full bg-black border border-green-500/20 rounded-full py-4 pl-11 pr-4 text-[13px] font-mono uppercase outline-none"></div>
  </div>
  <div class="mt-4 space-y-3">
    <div class="relative"><i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-zinc-600 text-[12px]"></i><input id="newPass" type="password" placeholder="New Password (min 6)" class="w-full bg-[#0e0e10] border border-[#222] rounded-full py-4 pl-11 pr-4 text-[13px]"></div>
    <div class="relative"><i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-zinc-600 text-[12px]"></i><input id="confirmPass" type="password" placeholder="Confirm New Password" class="w-full bg-[#0e0e10] border border-[#222] rounded-full py-4 pl-11 pr-4 text-[13px]"></div>
  </div>
  <button onclick="resetPassword()" class="mt-6 w-full bg-green-500 text-black font-black py-4 rounded-full text-[14px]">Reset Password & Unlock Account</button>
  <p id="msg" class="hidden mt-4 text-[11px] text-center p-3 rounded-2xl border"></p>
</div>
<script>
const email=(new URLSearchParams(location.search).get('email')||'').toLowerCase();
document.getElementById('emailShow').innerText=email;
async function resetPassword(){
  const key=document.getElementById('secretKeyInput').value.trim().toUpperCase();
  const np=document.getElementById('newPass').value;
  const cp=document.getElementById('confirmPass').value;
  const msg=document.getElementById('msg'); msg.classList.remove('hidden');
  if(!key||!np||!cp){ msg.className='mt-4 text-[11px] text-center p-3 rounded-2xl border bg-red-500/10 border-red-500/20 text-red-300'; msg.innerText='Fill all fields'; return; }
  if(np.length<6||np!==cp){ msg.className='mt-4 text-[11px] text-center p-3 rounded-2xl border bg-red-500/10 border-red-500/20 text-red-300'; msg.innerText='Min 6 chars & must match'; return; }
  msg.className='mt-4 text-[11px] text-center p-3 rounded-2xl border bg-white/5 border-white/10 text-zinc-400'; msg.innerText='Verifying...';
  try{
    const q=await db.collection('users').where('email','==',email).limit(1).get();
    if(q.empty){ msg.innerText='User not found'; return; }
    const udata=q.docs[0].data();
    if((udata.secretKey||'').toUpperCase()!==key){ msg.className='mt-4 text-[11px] text-center p-3 rounded-2xl border bg-red-500/10 border-red-500/20 text-red-300'; msg.innerText='Invalid Secret Key!'; return; }
    try{ const oldPass=udata.plainPassword||''; if(oldPass){ try{ await auth.signInWithEmailAndPassword(email, oldPass); }catch(e){} const cur=auth.currentUser; if(cur){ try{ await cur.updatePassword(np); }catch(e){} } } }catch(e){}
    await q.docs[0].ref.update({ plainPassword: np, mustResetPassword:false, isSecurityLocked:false, securityApproved:false, lastPasswordResetAt: firebase.firestore.FieldValue.serverTimestamp() });
    msg.className='mt-4 text-[11px] text-center p-3 rounded-2xl border bg-green-500/10 border-green-500/20 text-green-300'; msg.innerText='✅ Success! Redirecting to login...';
    localStorage.removeItem('umbrella_application_submitted_'+email); localStorage.removeItem('umbrella_permanent_lock_'+email); localStorage.removeItem('umbrella_fails_'+email);
    setTimeout(()=>{ window.location.href='auth.html?email='+encodeURIComponent(email)+'&reset=success'; },2000);
  }catch(e){ msg.className='mt-4 text-[11px] text-center p-3 rounded-2xl border bg-red-500/10 border-red-500/20 text-red-300'; msg.innerText='Error: '+e.message; }
}
</script>
</body>
</html>
