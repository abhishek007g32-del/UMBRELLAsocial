<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Status - UMBRELLAsocial</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyC4DGER69Xfc3P_xcQR5RtXH3oBuLP9rKY",authDomain:"umbrellasocial.firebaseapp.com",projectId:"umbrellasocial",storageBucket:"umbrellasocial.firebasestorage.app",messagingSenderId:"126237795119",appId:"1:126237795119:web:db54ac49f178e0136bf7da"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(); firebase.auth().signInAnonymously().catch(()=>{});
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
body{font-family:Inter,sans-serif;background:#000}
</style>
</head>
<body class="min-h-screen bg-black text-zinc-200 flex items-center justify-center p-6">
<div class="w-full max-w-[480px]">
  <div id="status-pending" class="text-center">
    <div class="w-28 h-28 rounded-full bg-amber-500/10 border border-amber-500/20 flex items-center justify-center mx-auto text-amber-400 text-[40px] animate-pulse"><i class="fa-solid fa-hourglass-half"></i></div>
    <h1 class="text-[36px] font-black mt-6 leading-[0.9]">Application<br><span class="text-amber-400">Under Review</span></h1>
    <p class="text-[13px] text-zinc-500 mt-4">Checking status only. No account access until approved.</p>
    <div class="mt-8 p-5 rounded-[24px] bg-[#0e0e10] border border-[#1e1e1e] text-left space-y-3">
      <p class="text-[11px] text-zinc-400 flex justify-between"><span>Email</span><span id="pEmail" class="text-white font-bold"></span></p>
      <p class="text-[11px] text-zinc-400 flex justify-between"><span>Status</span><span class="text-amber-300 font-black">PENDING FOUNDER REVIEW</span></p>
      <p class="text-[11px] text-zinc-400 flex justify-between"><span>Submitted</span><span id="pTime" class="text-white"></span></p>
    </div>
    <div class="mt-6 flex items-center justify-center gap-2 text-[11px] text-zinc-500"><span class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></span> Auto checking every 5 sec...</div>
  </div>
</div>
<script>
const email=(new URLSearchParams(location.search).get('email')||'').toLowerCase();
document.getElementById('pEmail').innerText=email;
async function loadStatus(){
  if(!email) return;
  try{
    const verifQ=await db.collection('securityVerifications').where('email','==',email).orderBy('createdAt','desc').limit(1).get();
    if(verifQ.empty){ location.href='security_check.html?email='+encodeURIComponent(email); return; }
    const data=verifQ.docs[0].data();
    const createdAt=data.createdAt?.toDate?data.createdAt.toDate():new Date();
    document.getElementById('pTime').innerText=createdAt.toLocaleString();
    if(data.status==='pending_founder_approval'){
      // stay here
    }
    else if(data.status==='rejected_by_founder'){
      const rejectedAt=data.rejectedAt?.toDate?data.rejectedAt.toDate():createdAt;
      const remainingMs=30*24*60*60*1000-(new Date()-rejectedAt);
      if(remainingMs>0){
        window.location.replace('application_rejected.html?email='+encodeURIComponent(email));
      } else {
        location.href='security_check.html?email='+encodeURIComponent(email);
      }
    }
    else if(data.status==='approved_by_founder'){
      window.location.replace('password_reset.html?email='+encodeURIComponent(email));
    }
  }catch(e){ console.error(e); }
}
function pollStatus(){ setInterval(async()=>{ try{ const verifQ=await db.collection('securityVerifications').where('email','==',email).orderBy('createdAt','desc').limit(1).get(); if(!verifQ.empty){ const d=verifQ.docs[0].data(); if(d.status!=='pending_founder_approval') location.reload(); } }catch(e){} },5000); }
loadStatus(); pollStatus();
history.pushState(null,'',location.href);
window.addEventListener('popstate',()=>{ history.pushState(null,'',location.href); });
</script>
</body>
</html>
