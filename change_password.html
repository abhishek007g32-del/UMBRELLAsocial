<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password - UMBRELLA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyC4DGER69Xfc3P_xcQR5RtXH3oBuLP9rKY",authDomain:"umbrellasocial.firebaseapp.com",projectId:"umbrellasocial",storageBucket:"umbrellasocial.firebasestorage.app",messagingSenderId:"126237795119",appId:"1:126237795119:web:db54ac49f178e0136bf7da"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();
</script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-[420px] bg-[#0e0e10] border border-[#1e1e1e] rounded-[32px] p-8">
  <div class="text-center mb-6">
    <div class="w-14 h-14 rounded-full bg-[#1d9bf0]/10 border border-[#1d9bf0]/20 flex items-center justify-center mx-auto text-[#1d9bf0]"><i class="fa-solid fa-key"></i></div>
    <h2 class="text-[24px] font-black mt-4">Set New Password</h2>
    <p class="text-[11px] text-zinc-500 mt-1">VERIFIED SECURE • SECRET KEY MATCHED</p>
    <p class="text-[12px] text-zinc-400 mt-2">Account: <span id="emailShow" class="text-white font-bold"></span></p>
  </div>
  <div id="alert" class="hidden mb-4 p-3 rounded-xl text-[12px] border"></div>
  <div class="space-y-3">
    <input id="newPass" type="password" placeholder="New Password (min 6 chars)" class="w-full bg-black border border-[#222] rounded-full py-4 px-5 text-[14px] outline-none focus:border-[#1d9bf0]/50">
    <input id="confirmPass" type="password" placeholder="Confirm New Password" class="w-full bg-black border border-[#222] rounded-full py-4 px-5 text-[14px] outline-none focus:border-[#1d9bf0]/50">
    <button onclick="changePassword()" id="btn" class="w-full bg-white text-black font-black py-4 rounded-full text-[14px]">Update Password & Login</button>
    <p class="text-[10px] text-zinc-600 text-center">Password will be updated in Firebase Authentication</p>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const uid = params.get('uid') || localStorage.getItem('umbrella_recovery_uid');
const email = decodeURIComponent(params.get('email') || localStorage.getItem('umbrella_recovery_email') || '');
const verified = localStorage.getItem('umbrella_recovery_verified');
if(!uid || verified!=='true'){ location.replace('auth.html'); }
document.getElementById('emailShow').innerText = email;
function showAlert(m, ok=false){
  const el=document.getElementById('alert');
  el.classList.remove('hidden');
  el.className=`mb-4 p-3 rounded-xl text-[12px] border ${ok?'bg-green-500/10 border-green-500/20 text-green-300':'bg-red-500/10 border-red-500/20 text-red-300'}`;
  el.innerText=m;
}
async function changePassword(){
  const np=document.getElementById('newPass').value.trim();
  const cp=document.getElementById('confirmPass').value.trim();
  if(np.length<6){ showAlert('Min 6 chars'); return; }
  if(np!==cp){ showAlert('Passwords do not match'); return; }
  const btn=document.getElementById('btn');
  btn.disabled=true; btn.innerText='Updating...';
  try{
    // 1. Get user doc (now allowed because you updated rules)
    const docSnap = await db.collection('users').doc(uid).get();
    if(!docSnap.exists){ showAlert('User not found'); btn.disabled=false; return; }
    const data = docSnap.data();
    const oldPass = data.plainPassword || '';

    // 2. Sign in with old password if not already signed in
    if(!auth.currentUser){
      if(!oldPass){ showAlert('Old password not saved. Please go to Firebase Console > Authentication and reset password manually for this old account, then re-create account. For new accounts it will work.'); btn.disabled=false; return; }
      await auth.signInWithEmailAndPassword(email, oldPass);
    }

    // 3. Update Auth password
    await auth.currentUser.updatePassword(np);

    // 4. Update Firestore
    await db.collection('users').doc(uid).update({
      plainPassword: np,
      passwordChangedAt: new Date().toISOString()
    });

    showAlert('Password updated! Going to home...', true);
    localStorage.removeItem('umbrella_recovery_uid');
    localStorage.removeItem('umbrella_recovery_email');
    localStorage.removeItem('umbrella_recovery_verified');
    localStorage.setItem('umbrella_is_logged_in','true');
    setTimeout(()=> location.replace('homepage.html'), 1200);

  }catch(err){
    console.error(err);
    if(err.code==='auth/requires-recent-login'){
      showAlert('Session expired. Please sign in again with old password, then try.');
    }else{
      showAlert('Failed: '+err.message);
    }
    btn.disabled=false;
    btn.innerText='Update Password & Login';
  }
}
</script>
</body>
</html>
