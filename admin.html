


<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin / UMBRELLAsocial</title>
<style>
.badge-locked{flex-shrink:0!important;display:inline-flex!important;align-items:center!important;gap:4px!important}
.badge-group-universal{display:inline-flex!important;align-items:center!important;gap:5px!important;vertical-align:middle!important;margin-left:7px!important;flex-shrink:0!important}
.badge-item{width:18px!important;height:18px!important;border-radius:50%!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;font-size:10px!important;font-weight:900!important;line-height:1!important;flex-shrink:0!important}
.badge-verified-universal{background:#1d9bf0!important;color:white!important;}
.badge-featured-universal{background:linear-gradient(135deg,#a855f7,#3b82f6)!important;color:white!important;}
.badge-founder-universal{background:linear-gradient(135deg,#fbbf24,#f97316)!important;color:black!important;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyC4DGER69Xfc3P_xcQR5RtXH3oBuLP9rKY",authDomain:"umbrellasocial.firebaseapp.com",projectId:"umbrellasocial",storageBucket:"umbrellasocial.firebasestorage.app",messagingSenderId:"126237795119",appId:"1:126237795119:web:db54ac49f178e0136bf7da"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(); const auth=firebase.auth();
let currentUid=null, allUsers=[], banTargetUid=null, currentVerif=null;
const REQUIRED_DAYS=180;
document.addEventListener('DOMContentLoaded',()=>{
  auth.onAuthStateChanged(async u=>{
    if(!u){ location.href='auth.html'; return; }
    currentUid=u.uid;
    const snap=await db.collection('users').doc(u.uid).get();
    if(!snap.exists ||!snap.data().isAdmin){ alert('Not admin'); location.href='homepage.html'; return; }
    document.getElementById('loader').style.display='none';
    document.getElementById('mainApp').style.display='flex';
    loadStats(); loadVerifications(); loadUsers(); loadReports(); loadPunishments(); listenBadges(); loadUnlockRequests(); listenUnlockBadge();
  });
});
function cleanH(h){ if(!h) return 'user'; return h.toString().replace(/@/g,'').trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,30)||'user'; }

// UNIVERSAL BADGE - NO FONT AWESOME DEPENDENCY - TEXT SYMBOLS - 100% VISIBLE
function getSingleTag(u){
  if(!u) return '';
  if(u.isStaff &&!u.isFounder){
    const role=(u.staffRole||'STAFF').toUpperCase().replace(' TEAM','');
    return `<span class="badge-locked inline-flex items-center gap-1 ml-1.5 px-2 py-0.5 rounded-full bg-[#111] border border-amber-500/30 text-amber-400 text-[8px] font-black"> ${role}</span>`;
  }
  let html = '<span class="badge-group-universal">';
  if(u.isVerified){ html += '<span class="badge-item badge-verified-universal" title="Verified">✓</span>'; }
  if(u.isFeatured||u.hasGlow){ html += '<span class="badge-item badge-featured-universal" title="Featured">⚡</span>'; }
  if(u.isFounder){ html += '<span class="badge-item badge-founder-universal" title="Founder">👑</span>'; }
  html += '</span>';
  return html;
}
function getUserTags(u){
  let tags = getSingleTag(u);
  if(u.isAdmin&&!u.isFounder&&!u.isStaff) tags+=`<span class="ml-1.5 px-1.5 py-0.5 rounded-full bg-amber-500 text-black text-[8px] font-black">ADMIN</span>`;
  if(u.isBanned) tags+=`<span class="ml-1.5 px-1.5 py-0.5 rounded-full bg-red-500/20 text-red-400 border border-red-500/30 text-[8px] font-black">BANNED</span>`;
  if(u.mustResetPassword) tags+=`<span class="ml-1.5 px-1.5 py-0.5 rounded-full bg-green-500 text-black text-[8px] font-black">RESET</span>`;
  return tags;
}
function showToast(m,t="blue"){ const c=document.getElementById('toastContainer'); const d=document.createElement('div'); d.className=`flex items-center gap-2 px-4 py-2 rounded-full bg-white text-black font-bold text-[12px]`; d.innerText=m; c.appendChild(d); setTimeout(()=>d.remove(),3000); }
function listenBadges(){ db.collection('verificationRequests').where('status','==','pending').onSnapshot(s=>{ const c=s.size; document.querySelectorAll('.verifBadge').forEach(b=>{ if(c>0){ b.innerText=c; b.classList.remove('hidden'); b.classList.add('flex'); } else{ b.classList.add('hidden'); }}); });}
function listenUnlockBadge(){ db.collection('securityVerifications').where('status','==','pending_founder_approval').onSnapshot(s=>{ const c=s.size; const b=document.getElementById('unlockBadge'); if(b){ if(c>0){ b.innerText=c; b.classList.remove('hidden'); b.classList.add('flex'); } else{ b.classList.add('hidden'); }} const ds=document.getElementById('statUnlocks'); if(ds) ds.innerText=c; });}
function switchTab(tab){ document.querySelectorAll('.tab-pane').forEach(p=>p.classList.add('hidden')); document.getElementById(tab+'Pane').classList.remove('hidden'); document.querySelectorAll('.side-tab').forEach(b=>b.classList.remove('bg-white','text-black')); document.getElementById('tab-'+tab).classList.add('bg-white','text-black'); }
function loadStats(){ db.collection('users').onSnapshot(s=>{ document.getElementById('statUsers').innerText=s.size; }); db.collection('verificationRequests').where('status','==','pending').onSnapshot(s=>{ document.getElementById('statVerif').innerText=s.size; }); db.collection('reports').onSnapshot(s=>{ document.getElementById('statReports').innerText=s.size; }); db.collection('users').where('isBanned','==',true).onSnapshot(s=>{ document.getElementById('statBanned').innerText=s.size; document.getElementById('statPunish').innerText=s.size; });}
function loadVerifications(){
  db.collection('verificationRequests').onSnapshot(snap=>{
    let map=new Map(); snap.forEach(d=>{ const data={id:d.id,...d.data()}; if(!map.has(data.userId)) map.set(data.userId,data); });
    let docs=Array.from(map.values()).filter(r=>r.status==='pending');
    const container=document.getElementById('verifList'); if(docs.length===0){ container.innerHTML=`<div class="p-12 text-center border border-dashed border-[#2f3336] rounded-2xl"><p class="text-white font-bold">No pending</p></div>`; return; }
    let html=''; docs.forEach(r=>{ html+=`<div onclick="openVerifModal('${r.id}')" class="p-4 bg-[#0f0f0f] border border-[#222] rounded-2xl"><p class="text-white font-bold">${r.name}</p></div>`; }); container.innerHTML=html; window._verifCache={}; docs.forEach(d=> window._verifCache[d.id]=d);
  });
}
async function openVerifModal(id){ const r=window._verifCache[id]; currentVerif=r; const m=document.getElementById('verifDetailModal'); m.classList.remove('hidden'); m.classList.add('flex'); document.getElementById('vd_name').innerText=r.name; document.getElementById('vd_userId').innerText=r.userId; }
function closeVerifModal(){ document.getElementById('verifDetailModal').classList.add('hidden'); document.getElementById('verifDetailModal').classList.remove('flex'); }
async function approveVerif(){ const id=currentVerif?.id; const uid=currentVerif?.userId; const t=currentVerif?.requestedType||'blue'; await db.collection('verificationRequests').doc(id).update({status:'approved',reviewedAt:firebase.firestore.FieldValue.serverTimestamp()}); let upd={}; if(t==='blue') upd={isVerified:true, verifiedType:'blue', isFeatured:false, hasGlow:false, verifiedAt: firebase.firestore.FieldValue.serverTimestamp()}; else upd={isVerified:true, verifiedType:'glow', isFeatured:true, hasGlow:true, verifiedAt: firebase.firestore.FieldValue.serverTimestamp()}; await db.collection('users').doc(uid).update(upd); closeVerifModal(); showToast('Approved'); }
async function rejectVerif(){ await db.collection('verificationRequests').doc(currentVerif.id).update({status:'rejected'}); closeVerifModal(); }
async function deleteVerif(){ await db.collection('verificationRequests').doc(currentVerif.id).delete(); closeVerifModal(); }
function loadUsers(){ db.collection('users').onSnapshot(snap=>{ allUsers=[]; snap.forEach(d=>allUsers.push({id:d.id,...d.data()})); renderUsers(allUsers); }); }
function renderUsers(list){
  const container=document.getElementById('usersList');
  let html='';
  list.forEach(u=>{
    if((u.name==='User'||!u.name)&&!u.username&&!u.handle) return;
    const handle=cleanH(u.username||u.handle);
    html+=`<div class="flex items-center gap-3 p-3 bg-[#0f0f0f] border border-[#222] rounded-2xl">
      <div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-white overflow-hidden flex-shrink-0">${u.photoURL?`<img src="${u.photoURL}" class="w-full h-full object-cover">`: (u.name||'U').substring(0,2).toUpperCase()}</div>
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-bold text-white flex items-center flex-wrap gap-1"><span>${u.name||'User'}</span> <span class="badge-locked">${getUserTags(u)}</span></p>
        <p class="text-[11px] text-[#666] truncate">@${handle} • ${u.email||''}</p>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="manualVerify('${u.id}','blue')" class="w-7 h-7 rounded-full bg-[#1d9bf0]/20 text-[#1d9bf0] flex items-center justify-center">✓</button>
        <button onclick="manualVerify('${u.id}','glow')" class="w-7 h-7 rounded-full bg-purple-500/20 text-purple-300 flex items-center justify-center">⚡</button>
        <button onclick="manualVerify('${u.id}','none')" class="w-7 h-7 rounded-full bg-zinc-800 text-zinc-400 flex items-center justify-center">✕</button>
        <button onclick="openBanModal('${u.id}')" class="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center">⛔</button>
        <button onclick="deleteUser('${u.id}')" class="w-7 h-7 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center">🗑️</button>
      </div>
    </div>`;
  });
  container.innerHTML=html;
}
function searchUsers(v){ const q=v.toLowerCase(); const f=allUsers.filter(u=> (u.name||'').toLowerCase().includes(q) || cleanH(u.username||u.handle||'').includes(q) || (u.email||'').toLowerCase().includes(q)); renderUsers(f); }
async function manualVerify(uid,type){ let data={}; if(type==='blue') data={isVerified:true,verifiedType:'blue',isFeatured:false,hasGlow:false, verifiedAt: firebase.firestore.FieldValue.serverTimestamp()}; if(type==='glow') data={isVerified:true,verifiedType:'glow',isFeatured:true,hasGlow:true, verifiedAt: firebase.firestore.FieldValue.serverTimestamp()}; if(type==='none') data={isVerified:false,verifiedType:'none',isFeatured:false,hasGlow:false}; await db.collection('users').doc(uid).update(data); showToast(type); }
function loadPunishments(){ db.collection('users').where('isBanned','==',true).onSnapshot(snap=>{ const c=document.getElementById('punishList'); if(snap.empty){ c.innerHTML='No banned'; return; } let h=''; snap.forEach(d=>{ const u=d.data(); h+=`<div class="p-3 bg-[#0f0f0f] border border-red-500/20 rounded-2xl flex justify-between"><p class="text-white text-sm flex items-center gap-2">${u.name} <span class="badge-locked">${getUserTags(u)}</span></p><button onclick="unbanUser('${d.id}')" class="text-green-400 text-xs">Restore</button></div>`; }); c.innerHTML=h; }); }
async function unbanUser(uid){ await db.collection('users').doc(uid).update({isBanned:false}); }
function openBanModal(uid){ banTargetUid=uid; document.getElementById('banModal').classList.remove('hidden'); document.getElementById('banModal').classList.add('flex'); }
function closeBanModal(){ document.getElementById('banModal').classList.add('hidden'); document.getElementById('banModal').classList.remove('flex'); }
async function confirmBan(){ const r=document.getElementById('customBanReason').value||'Violation'; await db.collection('users').doc(banTargetUid).update({isBanned:true, banReason:r}); closeBanModal(); }
async function deleteUser(uid){ if(!confirm('Delete?')) return; await db.collection('users').doc(uid).delete(); }
function loadReports(){ db.collection('reports').onSnapshot(snap=>{ let h=''; snap.forEach(d=>{ h+=`<div class="p-2 bg-[#0f0f0f] border border-[#222] rounded-xl text-xs text-white">${d.data().reason}</div>`; }); document.getElementById('reportsList').innerHTML=h||'No reports'; }); }
function loadUnlockRequests(){ db.collection('securityVerifications').orderBy('createdAt','desc').onSnapshot(snap=>{ const c=document.getElementById('unlocksList'); if(snap.empty){ c.innerHTML='No requests'; return; } let h=''; snap.forEach(doc=>{ const d=doc.data(); h+=`<div class="p-4 bg-[#0f0f0f] border border-[#222] rounded-2xl"><p class="text-white text-sm">${d.email}</p></div>`; }); c.innerHTML=h; });}
</script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{background:#000;color:#e7e9ea;font-family:Inter,sans-serif}.hidden{display:none!important} #toastContainer{position:fixed;top:20px;right:20px;z-index:9999}</style>
</head>
<body>
<div id="toastContainer"></div>
<div id="loader" class="fixed inset-0 bg-black flex items-center justify-center z-50"><div class="w-8 h-8 border-2 border-zinc-800 border-t-white rounded-full animate-spin"></div></div>
<div id="mainApp" style="display:none" class="w-full min-h-screen flex">
  <div class="w-64 border-r border-[#1a1a1a] p-4 flex flex-col sticky top-0 h-screen bg-[#080808]">
    <h1 class="font-black text-white text-[18px]">UMBRELLA<span class="text-amber-400"> ADMIN</span></h1>
    <nav class="mt-8 space-y-1">
      <button id="tab-dashboard" onclick="switchTab('dashboard')" class="side-tab w-full flex items-center gap-3 px-4 py-3 rounded-full text-sm font-bold bg-white text-black">Dashboard</button>
      <button id="tab-verifications" onclick="switchTab('verifications')" class="side-tab w-full flex items-center gap-3 px-4 py-3 rounded-full text-sm font-bold text-[#777] relative">Verifications <span class="verifBadge hidden absolute right-3 bg-red-500 text-white text-[10px] w-5 h-5 items-center justify-center rounded-full">0</span></button>
      <button id="tab-unlocks" onclick="switchTab('unlocks')" class="side-tab w-full flex items-center gap-3 px-4 py-3 rounded-full text-sm font-bold text-[#777] relative">Unlock Requests <span id="unlockBadge" class="hidden absolute right-3 bg-amber-500 text-black text-[10px] w-5 h-5 items-center justify-center rounded-full">0</span></button>
      <button id="tab-users" onclick="switchTab('users')" class="side-tab w-full flex items-center gap-3 px-4 py-3 rounded-full text-sm font-bold text-[#777]">Users</button>
      <button id="tab-punishments" onclick="switchTab('punishments')" class="side-tab w-full flex items-center gap-3 px-4 py-3 rounded-full text-sm font-bold text-[#777] relative">Punishments <span id="statPunish" class="absolute right-3 bg-amber-500 text-black text-[10px] px-2 py-0.5 rounded-full">0</span></button>
      <button id="tab-reports" onclick="switchTab('reports')" class="side-tab w-full flex items-center gap-3 px-4 py-3 rounded-full text-sm font-bold text-[#777]">Reports</button>
    </nav>
    <a href="founder_erp.html" class="mt-5 px-4 py-2 rounded-full bg-[#111] border border-[#222] text-white text-[11px] font-black">FOUNDER ERP</a>
  </div>
  <div class="flex-1 p-8 max-w-[900px]">
    <div id="dashboardPane" class="tab-pane"><h2 class="text-2xl font-black text-white">Overview - FIXED BADGES</h2><p class="text-xs text-white/40 mt-2">Verified ✓ FIRST → Featured ⚡ SECOND → Founder 👑 THIRD - Same as all pages, no FA dependency</p><div class="grid grid-cols-4 gap-4 mt-6"><div class="bg-[#0f0f0f] border border-[#222] rounded-2xl p-5"><p id="statUsers" class="text-2xl font-black text-white">0</p></div><div class="bg-[#0f0f0f] border border-[#222] rounded-2xl p-5"><p id="statVerif" class="text-2xl font-black text-amber-400">0</p></div><div class="bg-[#0f0f0f] border border-[#222] rounded-2xl p-5"><p id="statReports" class="text-2xl font-black text-red-400">0</p></div><div class="bg-[#0f0f0f] border border-[#222] rounded-2xl p-5"><p id="statBanned" class="text-2xl font-black text-white">0</p></div></div></div>
    <div id="verificationsPane" class="tab-pane hidden"><div id="verifList"></div></div>
    <div id="unlocksPane" class="tab-pane hidden"><div id="unlocksList"></div></div>
    <div id="usersPane" class="tab-pane hidden"><div class="flex justify-between mb-6"><h2 class="text-xl font-black text-white">Users - BADGES FIXED</h2><input oninput="searchUsers(this.value)" placeholder="Search..." class="bg-[#111] border border-[#222] rounded-full px-4 py-2 text-xs text-white w-64"></div><div id="usersList"></div></div>
    <div id="punishmentsPane" class="tab-pane hidden"><div id="punishList"></div></div>
    <div id="reportsPane" class="tab-pane hidden"><div id="reportsList"></div></div>
  </div>
</div>
<div id="verifDetailModal" class="hidden fixed inset-0 z-[200] bg-black/80 items-center justify-center p-4"><div class="bg-[#121212] border border-[#222] rounded-2xl w-full max-w-[500px] p-5"><p id="vd_name" class="text-white font-bold"></p><p id="vd_userId" class="text-[10px] text-[#666]"></p><div class="flex gap-2 mt-4"><button onclick="approveVerif()" class="flex-1 py-3 bg-blue-500 text-white rounded-full">Approve</button><button onclick="closeVerifModal()" class="flex-1 py-3 bg-zinc-800 text-white rounded-full">Close</button></div></div></div>
<div id="banModal" class="hidden fixed inset-0 z-[100] bg-black/80 items-center justify-center p-4"><div class="bg-[#111] border border-[#222] rounded-2xl w-full max-w-[400px] p-5"><textarea id="customBanReason" placeholder="Reason" class="w-full bg-black border border-[#222] rounded-xl p-3 text-white"></textarea><div class="flex gap-2 mt-3"><button onclick="closeBanModal()" class="flex-1 py-2 bg-zinc-800 rounded-full text-white">Cancel</button><button onclick="confirmBan()" class="flex-1 py-2 bg-white text-black rounded-full">Ban</button></div></div></div>
</body>
</html>
