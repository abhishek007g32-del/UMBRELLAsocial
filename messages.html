<script>
const firebaseConfig={apiKey:"AIzaSyC4DGER69Xfc3P_xcQR5RtXH3oBuLP9rKY",authDomain:"umbrellasocial.firebaseapp.com",projectId:"umbrellasocial",storageBucket:"umbrellasocial.firebasestorage.app",messagingSenderId:"126237795119",appId:"1:126237795119:web:db54ac49f178e0136bf7da"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(); const auth=firebase.auth();
let currentUid=null, mutualCache={}, activeChatUid=null, chatUnsub=null, selectedImageBase64='';

function cleanH(h){ if(!h) return 'user'; return h.toString().replace(/@/g,'').trim().toLowerCase().replace(/[^a-z0-9_]/g,'')||'user'; }
function escapeHtml(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatTime(ts){ if(!ts) return 'now'; try{ const d=ts.toDate?ts.toDate():new Date(ts); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }catch(e){return '';} }

document.addEventListener('DOMContentLoaded',()=>{
 const logged=localStorage.getItem('umbrella_is_logged_in');
 auth.onAuthStateChanged(u=>{
  if(u && logged==='true'){
   currentUid=u.uid;
   db.collection('users').doc(u.uid).onSnapshot(snap=>{
    if(snap.exists && snap.data().isBanned){ location.replace('banned.html'); return; }
    document.getElementById('banCheckLoader').style.display='none';
    document.getElementById('mainApp').style.display='flex';
    loadMutualConversations();
   });
  } else location.href='auth.html';
 });
});

async function checkIsMutual(otherUid){
 if(mutualCache[otherUid]!==undefined) return mutualCache[otherUid];
 if(!otherUid||otherUid===currentUid) return false;
 const [iFollow,theyFollow]=await Promise.all([db.collection('follows').where('followerId','==',currentUid).where('followingId','==',otherUid).limit(1).get(), db.collection('follows').where('followerId','==',otherUid).where('followingId','==',currentUid).limit(1).get()]);
 const mutual=!iFollow.empty&&!theyFollow.empty; mutualCache[otherUid]=mutual; return mutual;
}

async function loadMutualConversations(){
 const list=document.getElementById('conversationsList');
 const snap=await db.collection('follows').where('followerId','==',currentUid).get();
 const followingIds=snap.docs.map(d=>d.data().followingId);
 if(!followingIds.length){ list.innerHTML=`<div class="p-12 text-center text-white/30 text-[12px]">No mutuals</div>`; return; }
 let mutualUsers=[];
 for(const fid of followingIds){ if(await checkIsMutual(fid)){ const uDoc=await db.collection('users').doc(fid).get(); if(uDoc.exists) mutualUsers.push({uid:fid,...uDoc.data()}); } }
 if(!mutualUsers.length){ list.innerHTML=`<div class="p-8 text-center text-white/30 text-[11px]">No mutual follow-back</div>`; return; }
 let html='';
 mutualUsers.forEach(u=>{
   const name=u.name||'User'; const initials=name.substring(0,2).toUpperCase();
   html+=`<div onclick="openChat('${u.uid}')" class="p-4 flex items-center gap-3 border-b border-white/[0.05] hover:bg-white/[0.03] cursor-pointer"><div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center font-black text-[11px] overflow-hidden">${u.photoURL||u.profilePic?`<img src="${u.photoURL||u.profilePic}" class="w-full h-full object-cover">`:initials}</div><div class="flex-1 min-w-0"><div class="font-bold text-[13px] text-white truncate">${escapeHtml(name)}</div><p class="text-[11px] text-white/35">@${cleanH(u.username||u.handle)}</p></div><i class="fa-solid fa-chevron-right text-white/20 text-[10px]"></i></div>`;
 });
 list.innerHTML=html;
}

function openChat(uid){
 if(!uid) return;
 activeChatUid=uid;
 document.getElementById('conversationsPanel').style.display='none';
 document.getElementById('chatWrapper').style.display='flex';
 db.collection('users').doc(uid).get().then(uDoc=>{
  const ud=uDoc.exists?uDoc.data():{}; const name=ud.name||'User';
  document.getElementById('activeName').innerText=name;
  document.getElementById('activeHandle').innerText='@'+cleanH(ud.username||ud.handle);
  document.getElementById('activeAvatar').innerHTML=ud.photoURL||ud.profilePic?`<img src="${ud.photoURL||ud.profilePic}" class="w-full h-full object-cover">`:name.substring(0,2).toUpperCase();
 });
 const container=document.getElementById('messagesContainer');
 const chatId=[currentUid,uid].sort().join('_');
 if(chatUnsub) chatUnsub();
 chatUnsub=db.collection('chats').doc(chatId).collection('messages').orderBy('timestamp','asc').onSnapshot(snap=>{
  if(snap.empty){ container.innerHTML=`<div class="py-12 text-center"><p class="font-black text-white text-[13px]">Say Hi! ☂️</p><p class="text-[10px] text-zinc-500 mt-2">Be respectful - No hate, abuse, political, anti-national, AI, fake news</p></div>`; return; }
  let html='';
  snap.forEach(doc=>{
    const m=doc.data(); const isMe=m.senderId===currentUid; const time=formatTime(m.timestamp);
    const img=m.imageUrl?`<img src="${m.imageUrl}" class="rounded-xl mt-2 border border-white/10" style="max-height:200px; max-width:200px; object-fit:cover;">`:'';
    const txt=m.text?`<div style="font-size:12px; line-height:16px;">${escapeHtml(m.text)}</div>`:'';
    if(isMe) html+=`<div style="display:flex; justify-content:flex-end; margin-bottom:8px;"><div style="background:white; color:black; border-radius:16px; border-bottom-right-radius:4px; padding:8px 12px; max-width:58%;"><div>${txt}${img}</div><div style="font-size:9px; opacity:0.5; text-align:right; margin-top:4px;">${time} 🔒</div></div></div>`;
    else html+=`<div style="display:flex; gap:8px; margin-bottom:8px;"><div style="width:24px; height:24px; background:rgba(255,255,255,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8px; flex-shrink:0;">${m.senderName?.substring(0,2).toUpperCase()||'U'}</div><div style="background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); border-radius:16px; border-bottom-left-radius:4px; padding:8px 12px; max-width:58%; color:white;"><div>${txt}${img}</div><div style="font-size:9px; color:rgba(255,255,255,0.3); margin-top:4px;">${time}</div></div></div>`;
  });
  container.innerHTML=html;
  const h=document.getElementById('chatHistory'); h.scrollTop=h.scrollHeight;
 });
}

function closeChat(){
 if(chatUnsub) chatUnsub();
 document.getElementById('chatWrapper').style.display='none';
 document.getElementById('conversationsPanel').style.display='flex';
 activeChatUid=null;
}
function filterChats(){ const q=document.getElementById('searchChat').value.toLowerCase(); document.querySelectorAll('#conversationsList > div').forEach(el=>{ el.style.display=el.innerText.toLowerCase().includes(q)?'flex':'none'; }); }
function handleImageSelect(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); let w=img.width,h=img.height; const MAX=400; if(w>MAX||h>MAX){ if(w>h){ h*=MAX/w; w=MAX; } else { w*=MAX/h; h=MAX; } } c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); selectedImageBase64=c.toDataURL('image/jpeg',0.6); document.getElementById('previewImg').src=selectedImageBase64; document.getElementById('imagePreviewBox').classList.remove('hidden'); }; img.src=ev.target.result; }; r.readAsDataURL(f); }
function clearImagePreview(){ selectedImageBase64=''; document.getElementById('imagePreviewBox').classList.add('hidden'); }

// === SAFETY SYSTEM FOR MESSAGES ===
const BANNED_MSG_WORDS=['chutiya','bhenchod','madarchod','bsdk','gandu','randi','bhosdi','harami','suar','fuck','bitch','slut','whore','asshole','kill you','anti india','anti national','desh drohi','khalistan','pakistan zindabad','tukde tukde','bjp','congress','modi','rahul gandhi','election fraud','midjourney','stable diffusion','ai generated','isis','terrorist'];
function checkMessageSafety(text){
  if(!text) return {safe:true};
  const low=text.toLowerCase();
  for(let w of BANNED_MSG_WORDS){ if(low.includes(w.toLowerCase())) return {safe:false, word:w, reason:`Blocked: "${w}" — No hate/abuse/political/anti-national/AI/fake allowed.`}; }
  if(/anti\s*national/i.test(text) || /anti\s*india/i.test(text) || /hate\s*(muslim|hindu|christian|sikh|dalit)/i.test(text)) return {safe:false, word:'hate/political', reason:'Hate / Political / Anti-national content not allowed in messages.'};
  return {safe:true};
}

async function sendMessage(){
  const input=document.getElementById('messageInput');
  const text=input.value.trim();
  const errBox=document.getElementById('msgSafetyError');
  if(errBox) errBox.classList.add('hidden');
  if((!text&&!selectedImageBase64)||!activeChatUid) return;

  // Safety check first
  const safety=checkMessageSafety(text);
  if(!safety.safe){
    if(errBox){ errBox.innerText='⛔ '+safety.reason; errBox.classList.remove('hidden'); }
    else alert('⛔ '+safety.reason);
    let v=parseInt(localStorage.getItem('umbrella_msg_violation_'+currentUid)||'0')+1;
    localStorage.setItem('umbrella_msg_violation_'+currentUid, v);
    if(v>=3){
      alert('⛔ 3 violations in messages. Account locked for Aadhar + Face verification.');
      const emailSnap=await db.collection('users').doc(currentUid).get();
      const email=emailSnap.exists?emailSnap.data().email:'';
      if(email){
        localStorage.setItem('umbrella_permanent_lock_'+email.toLowerCase(), 'true');
        localStorage.setItem('umbrella_lock_'+email.toLowerCase(), new Date('2099-12-31').toISOString());
        location.href='security_check.html?email='+encodeURIComponent(email);
      }
      return;
    }
    return;
  }

  if(!await checkIsMutual(activeChatUid)){ alert('Not mutual'); return; }
  const chatId=[currentUid,activeChatUid].sort().join('_');
  const myDoc=await db.collection('users').doc(currentUid).get();
  const myName=myDoc.exists?myDoc.data().name:'User';
  await db.collection('chats').doc(chatId).collection('messages').add({text:text||'',imageUrl:selectedImageBase64||'',senderId:currentUid,senderName:myName,timestamp:firebase.firestore.FieldValue.serverTimestamp(),expiresAt:firebase.firestore.Timestamp.fromDate(new Date(Date.now()+86400000))});
  await db.collection('chats').doc(chatId).set({participants:[currentUid,activeChatUid],lastMessage:text||'Image',updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  input.value=''; clearImagePreview();
}
</script>
